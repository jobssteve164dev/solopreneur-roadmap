</style></head><body data-variant="decision"><div class="app"><header class="top"><img class="wordmark" src="../../resources/logo_with_text.svg" alt="SoloMap"><div class="tools"><button class="icon" aria-label="专注时间">◷</button><button class="icon" aria-label="快速共创">✧</button><button class="icon active" aria-label="智能内核">✦</button><button class="icon" aria-label="设置">⚙</button></div></header><div class="subhead"><a href="#" class="back" data-back aria-label="返回首页">‹</a> 智能内核 <span class="spacer"></span><span class="quiet">今天</span></div><main class="body"><section data-home><div class="date">9 月 29 日 · 我的应用</div><div class="hero"><h1 class="title">先处理登录问题。</h1><p>用户能否顺利进入应用，决定了后面的功能能否被使用。</p></div><article class="decision"><div class="eyebrow">建议先做</div><h2>先确认登录失败的范围</h2><p>弄清楚哪些用户受影响，再决定修复顺序。</p><button class="primary" data-prompt="为什么先排查登录问题？">聊聊这个建议 →</button></article><div class="section-label">还可以接着想</div><div class="option"><span class="number">01</span><div><b>先查哪些用户受影响？</b><p>找到共通的失败路径。</p></div></div><div class="option"><span class="number">02</span><div><b>导出功能要不要延后？</b><p>先看是否有人现在急需导出数据。</p></div></div><div class="mini-actions"><button class="secondary" data-prompt="比较登录和导出的优先级">比较这两件事</button><button class="secondary" data-prompt="给我一个处理顺序">给我处理顺序</button></div></section><section data-chat class="hide"><div class="chat-log" data-log><div class="eyebrow">围绕一个决定继续聊</div><div class="message user-message">为什么先排查登录问题？</div><div class="message answer">登录失败会挡住用户使用应用。先确认影响范围和复现方式，再决定修复顺序；导出可以随后推进。</div></div></section></main><footer class="composer"><div class="input-row"><textarea aria-label="继续讨论" placeholder="继续问，或说出你的顾虑…" rows="2"></textarea><button class="send" aria-label="发送" disabled>↑</button></div><div class="hint">Enter 发送 · Shift + Enter 换行</div></footer></div><script src="shared.js"></script></body></html>
