name: Publish VS Code Extension

on:
  push:
    branches:
      - main # 当代码推送到 main 主分支时触发自动检测与发布
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.vscodeignore'
      - 'LICENSE'
      - '.github/workflows/publish.yml'
  workflow_dispatch: # 支持手动点击触发发布

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 完整拉取历史和标签
          ref: main      # 显式拉取 main 分支，避免分离 HEAD 导致无法 push

      - name: Check Extension Changes
        id: extension_changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Manual publish requested."
            exit 0
          fi

          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse "$HEAD^" 2>/dev/null || true)"
          fi

          if [ -z "$BASE" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit found; publishing to avoid missing an extension release."
            exit 0
          fi

          mapfile -t changed_files < <(git diff --name-only "$BASE" "$HEAD")
          should_publish=false
          for file in "${changed_files[@]}"; do
            case "$file" in
              src/*|test/*|scripts/*|resources/*|package.json|package-lock.json|tsconfig.json|.vscodeignore|LICENSE|.github/workflows/publish.yml)
                should_publish=true
                break
                ;;
            esac
          done

          echo "Changed files:"
          printf ' - %s\n' "${changed_files[@]}"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.extension_changes.outputs.should_publish == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        if: steps.extension_changes.outputs.should_publish == 'true'
        run: npm ci

      - name: Validate Publishing Secrets
        if: steps.extension_changes.outputs.should_publish == 'true'
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT is empty. Visual Studio Marketplace publishing cannot proceed."
            exit 1
          fi
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT is empty. Open VSX publishing cannot proceed."
            exit 1
          fi
          npx --yes ovsx -p "$OVSX_PAT" verify-pat SZLK
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Configure Git
        if: steps.extension_changes.outputs.should_publish == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump Version
        if: steps.extension_changes.outputs.should_publish == 'true'
        id: bump
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> $GITHUB_ENV
          # 自动递增 package.json 的 patch 版本（末位数 +1）并自动生成 Git 提交与 Tag
          NEW_VERSION=$(npm version patch -m "chore(release): bump version to %s [skip ci]")
          VERSION="${NEW_VERSION#v}"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "新版本号: $NEW_VERSION"

      - name: Generate Release Notes
        if: steps.extension_changes.outputs.should_publish == 'true'
        run: |
          NOTES_PATH="/tmp/solomap-release-notes.md"
          TO_REF="HEAD~1"
          node scripts/generate-release-notes.cjs \
            --version "$VERSION" \
            --from "$PREVIOUS_TAG" \
            --to "$TO_REF" \
            --notes "$NOTES_PATH" \
            --changelog CHANGELOG.md
          git add CHANGELOG.md
          git commit --amend --no-edit
          git tag -f -a "$NEW_VERSION" -m "$NEW_VERSION"
          echo "RELEASE_NOTES_PATH=$NOTES_PATH" >> $GITHUB_ENV

      - name: Push Version Changes and Tag
        if: steps.extension_changes.outputs.should_publish == 'true'
        run: |
          # 将修改后的 package.json 推送回远程 main 分支
          git push origin main
          # 将自动生成的新版本 Tag 推送到远程仓库
          git push --force origin ${{ env.NEW_VERSION }}

      - name: Compile Extension
        if: steps.extension_changes.outputs.should_publish == 'true'
        run: npm run compile

      - name: Package Extension
        if: steps.extension_changes.outputs.should_publish == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VSIX_PATH="solopreneur-roadmap-${VERSION}.vsix"
          node scripts/package-vsix.cjs --out "$VSIX_PATH"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VSIX_PATH=$VSIX_PATH" >> $GITHUB_ENV
          echo "VSIX package: $VSIX_PATH"

      - name: Publish to Visual Studio Marketplace
        if: steps.extension_changes.outputs.should_publish == 'true'
        run: |
          for i in {1..3}; do
            echo "Attempt $i to publish to Visual Studio Marketplace..."
            if npx @vscode/vsce publish --packagePath "${{ env.VSIX_PATH }}" --skip-duplicate; then
              echo "Publish succeeded!"
              exit 0
            fi
            echo "Publish failed, waiting 15 seconds before retrying..."
            sleep 15
          done
          echo "All publish attempts failed."
          exit 1
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: steps.extension_changes.outputs.should_publish == 'true'
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT is empty. Open VSX publishing cannot proceed."
            exit 1
          fi
          for i in {1..3}; do
            echo "Attempt $i to publish to Open VSX..."
            if npx --yes ovsx -p "$OVSX_PAT" publish "${{ env.VSIX_PATH }}" --skip-duplicate; then
              echo "Open VSX publish succeeded!"
              exit 0
            fi
            echo "Open VSX publish failed, waiting 15 seconds before retrying..."
            sleep 15
          done
          echo "All Open VSX publish attempts failed."
          exit 1
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        if: steps.extension_changes.outputs.should_publish == 'true'
        run: |
          if gh release view "$NEW_VERSION" >/dev/null 2>&1; then
            gh release edit "$NEW_VERSION" --title "$NEW_VERSION" --notes-file "$RELEASE_NOTES_PATH" --latest
          else
            gh release create "$NEW_VERSION" --title "$NEW_VERSION" --notes-file "$RELEASE_NOTES_PATH" --target main --latest
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify Open VSX Availability
        if: steps.extension_changes.outputs.should_publish == 'true'
        run: |
          for i in {1..30}; do
            echo "Checking Open VSX availability for SZLK.solopreneur-roadmap $VERSION..."
            if curl -fsS "https://open-vsx.org/api/SZLK/solopreneur-roadmap/$VERSION" >/tmp/openvsx-extension.json; then
              node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('/tmp/openvsx-extension.json','utf8')); if (data.namespace !== 'SZLK' || data.name !== 'solopreneur-roadmap' || data.version !== process.env.VERSION) process.exit(1); console.log('Open VSX verified:', data.namespace + '.' + data.name + '@' + data.version);"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Open VSX accepted publish but did not expose SZLK.solopreneur-roadmap $VERSION in time. Treating visibility as pending instead of failing the release."
          exit 0
