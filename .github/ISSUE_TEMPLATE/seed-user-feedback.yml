name: Seed user feedback
description: Share what blocked you, what was unclear, or what you want next.
title: "[Feedback] "
labels:
  - feedback
  - seed-user
body:
  - type: dropdown
    id: feedback_type
    attributes:
      label: Feedback type
      options:
        - I could not get it working
        - I did not know the next step
        - I want a capability
    validations:
      required: false
  - type: checkboxes
    id: core_path
    attributes:
      label: Core path reached
      options:
        - label: Added a local project
        - label: Generated or opened a roadmap
        - label: Ran an Agent or Solo conversation
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: A short description is enough.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: false
  - type: textarea
    id: local_usage_summary
    attributes:
      label: Local usage summary
      description: SoloMap may prefill anonymous local counters here only when you open this issue from the extension. Remove it if you do not want to share it.
    validations:
      required: false
